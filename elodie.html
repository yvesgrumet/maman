<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suivi Andrée</title>
<meta name="theme-color" content="#2e6b5e">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Lato',sans-serif;background:linear-gradient(135deg,#2e6b5e 0%,#4a9c88 60%,#7bc4ae 100%);
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.carte{background:#fff;border-radius:24px;padding:40px 28px;max-width:400px;width:100%;text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,0.25);}
.ico{font-size:3.4rem;margin-bottom:16px;}
h1{font-family:'Playfair Display',serif;font-size:1.6rem;color:#2e6b5e;font-weight:700;margin-bottom:14px;line-height:1.3;}
p{font-size:0.97rem;color:#4a7a6d;line-height:1.6;margin-bottom:12px;}
.merci{margin-top:22px;padding-top:18px;border-top:1px solid #e2f0eb;font-size:0.9rem;color:#5e8f81;font-style:italic;}
</style>
</head>
<body>
<div class="carte">
  <div class="ico">🌿</div>
  <h1>Cet espace n'est plus actif</h1>
  <p>Le suivi n'est plus assuré depuis cette application.</p>
  <p>Vous pouvez la retirer de votre écran d'accueil.</p>
  <div class="merci">Merci pour le temps passé auprès d'Andrée.</div>
</div>
</body>
</html>
