<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visite guidée — Applications Maman 💛</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Lato',sans-serif;background:#1a0e20;color:#fff;min-height:100vh;display:flex;flex-direction:column;}

/* ── HEADER ── */
.hdr{background:linear-gradient(135deg,#7d4e6b,#c47898);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.hdr-title{font-family:'Playfair Display',serif;font-size:1.1rem;color:#fff;}
.hdr-sub{font-size:0.72rem;color:rgba(255,255,255,0.8);}
.chapter-pills{display:flex;gap:6px;}
.cpill{padding:5px 12px;border-radius:20px;font-size:0.72rem;font-weight:700;cursor:pointer;border:2px solid rgba(255,255,255,0.3);color:rgba(255,255,255,0.7);transition:all 0.2s;}
.cpill.on{background:#fff;color:#7d4e6b;border-color:#fff;}

/* ── STAGE ── */
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px 12px 8px;position:relative;overflow:hidden;}

/* ── PHONE FRAME ── */
.phone{width:min(260px,72vw);background:#1c1028;border-radius:30px;box-shadow:0 16px 48px rgba(0,0,0,0.6),0 0 0 2px #3a2a48;position:relative;flex-shrink:0;}
.phone-notch{width:80px;height:20px;background:#1c1028;border-radius:0 0 12px 12px;margin:0 auto;position:relative;z-index:2;}
.phone-screen{background:#fdf6f9;border-radius:0 0 24px 24px;overflow:hidden;position:relative;}

/* ── SCENE TEXT ── */
.scene-info{text-align:center;max-width:340px;padding:14px 10px 6px;}
.scene-num{font-size:0.68rem;font-weight:700;color:rgba(255,255,255,0.45);letter-spacing:1px;text-transform:uppercase;margin-bottom:4px;}
.scene-title{font-family:'Playfair Display',serif;font-size:1.15rem;color:#fff;margin-bottom:4px;}
.scene-desc{font-size:0.82rem;color:rgba(255,255,255,0.7);line-height:1.5;}

/* ── PROGRESS ── */
.progress-area{width:100%;padding:8px 16px 4px;flex-shrink:0;}
.progress-bar{height:3px;background:rgba(255,255,255,0.15);border-radius:2px;overflow:hidden;margin-bottom:8px;}
.progress-fill{height:100%;background:linear-gradient(90deg,#c47898,#e0a0bf);border-radius:2px;transition:width 0.1s linear;}

/* ── CONTROLS ── */
.controls{display:flex;align-items:center;justify-content:center;gap:16px;padding:6px 16px 16px;flex-shrink:0;}
.ctrl-btn{background:rgba(255,255,255,0.1);border:2px solid rgba(255,255,255,0.2);border-radius:50%;width:44px;height:44px;color:#fff;font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s;}
.ctrl-btn:hover,.ctrl-btn:active{background:rgba(255,255,255,0.2);}
.ctrl-play{width:56px;height:56px;font-size:1.4rem;background:linear-gradient(135deg,#c47898,#7d4e6b);border-color:transparent;box-shadow:0 4px 16px rgba(196,120,152,0.4);}
.ctrl-dots{display:flex;gap:5px;align-items:center;}
.dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,0.25);cursor:pointer;transition:all 0.2s;}
.dot.on{background:#e0a0bf;width:18px;border-radius:3px;}

/* ═══════════════════════════════════
   SCREEN COMPONENTS
═══════════════════════════════════ */

/* Top bar */
.s-bar{background:linear-gradient(135deg,#7d4e6b,#c47898);padding:10px 12px 8px;text-align:center;}
.s-date{font-size:0.7rem;color:rgba(255,255,255,0.85);font-family:'Playfair Display',serif;}
.s-time{font-size:1.6rem;font-weight:700;color:#fff;letter-spacing:1px;line-height:1.1;}
.s-mood-row{display:flex;gap:4px;justify-content:center;margin-top:6px;}
.s-mb{flex:1;background:rgba(255,255,255,0.15);border:1.5px solid rgba(255,255,255,0.25);border-radius:10px;padding:8px 4px;text-align:center;font-size:1.1rem;}
.s-mb.on{background:#eef8f3;border-color:#89b5a0;}
.s-mb-l{font-size:0.55rem;color:#fff8ee;font-weight:700;display:block;margin-top:2px;}
.s-mb.on .s-mb-l{color:#2e6b50;}

/* Cards */
.s-card{background:#fff;border-radius:12px;margin:6px 8px;padding:10px 12px;box-shadow:0 2px 8px rgba(180,120,160,0.1);}
.s-ct{font-family:'Playfair Display',serif;font-size:0.85rem;color:#7d4e6b;margin-bottom:8px;}
.s-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #f5eaf3;font-size:0.72rem;color:#5a3050;}
.s-row:last-child{border-bottom:none;}
.s-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.s-chip{display:inline-flex;align-items:center;gap:4px;background:#faedf3;border:1.5px solid #edd9e8;border-radius:12px;padding:3px 9px;font-size:0.65rem;font-weight:700;color:#7d4e6b;margin:2px;}
.s-chip.on{background:#89b5a0;border-color:#89b5a0;color:#fff;}

/* Input */
.s-inp{border:1.5px solid #edd9e8;border-radius:8px;padding:7px 10px;font-size:0.72rem;color:#5a3050;background:#fdf6f9;width:100%;margin-bottom:5px;}
.s-inp.focus{border-color:#c4789a;background:#fff;}

/* Status card */
.s-status{background:linear-gradient(135deg,#eef8f3,#f0f7f4);border-radius:12px;margin:6px 8px;padding:10px 12px;border:2px solid #89b5a0;}
.s-status-mood{font-size:1.2rem;}
.s-status-lbl{font-size:0.75rem;font-weight:700;color:#2e6b50;margin-left:4px;}
.s-status-msg{font-size:0.68rem;color:#3d5a40;margin-top:4px;font-style:italic;}

/* Contacts */
.s-contact{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #f5eaf3;}
.s-av{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.65rem;font-weight:700;color:#fff;flex-shrink:0;}
.s-cname{font-size:0.75rem;font-weight:700;color:#3d2040;}
.s-crel{font-size:0.62rem;color:#b07898;}
.s-cbtns{display:flex;gap:4px;margin-left:auto;}
.s-cbtn{background:#89b5a0;color:#fff;border:none;border-radius:6px;padding:3px 7px;font-size:0.58rem;font-weight:700;cursor:pointer;}
.s-cbtn.sms{background:#42a5f5;}

/* Calendar */
.s-cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-top:4px;}
.s-cal-h{text-align:center;font-size:0.52rem;color:#b07898;font-weight:700;padding:2px 0;}
.s-cal-d{text-align:center;font-size:0.62rem;padding:3px 1px;border-radius:5px;color:#5a3050;cursor:default;}
.s-cal-d.today{background:#c4789a;color:#fff;font-weight:700;}
.s-cal-d.bday{background:#fff0f7;color:#c4789a;font-weight:700;}

/* RDV */
.s-rdv{display:flex;align-items:center;justify-content:space-between;padding:6px 8px;background:#fffbe8;border-radius:8px;border-left:3px solid #e8c870;margin-bottom:5px;}
.s-rdv-t{font-size:0.72rem;font-weight:700;color:#7d4e6b;}
.s-rdv-d{font-size:0.6rem;color:#b07898;}
.s-rdv-badge{background:#e8c870;color:#7a5000;border-radius:5px;padding:2px 6px;font-size:0.55rem;font-weight:700;}

/* Message */
.s-msg{background:linear-gradient(135deg,#faedf3,#f0f7ff);border-radius:10px;padding:9px 10px;border-left:3px solid #c4789a;margin-bottom:6px;}
.s-msg-who{font-size:0.7rem;font-weight:700;color:#7d4e6b;}
.s-msg-txt{font-size:0.72rem;color:#3d2040;margin-top:2px;}

/* Send btn */
.s-send{display:block;width:calc(100% - 16px);margin:6px 8px;background:linear-gradient(135deg,#7d4e6b,#c47898);color:#fff;border:none;border-radius:10px;padding:9px;font-family:'Playfair Display',serif;font-size:0.78rem;text-align:center;}

/* Anniv banner */
.s-anniv{background:rgba(255,220,100,0.28);border-radius:8px;padding:4px 8px;text-align:center;font-size:0.65rem;color:#fff8cc;font-weight:700;margin:3px 8px;}

/* Shortcuts (maman) */
.s-scgrid{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;padding:6px 4px;}
.s-scbtn{display:flex;flex-direction:column;align-items:center;gap:2px;background:#faedf3;border:1.5px solid #edd9e8;border-radius:12px;padding:6px 5px;min-width:50px;}
.s-scbtn .s-av{width:28px;height:28px;font-size:0.55rem;}
.s-scbtn-l{font-size:0.55rem;color:#3d2040;font-weight:700;}

/* Animations */
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes checkmark{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes typing{from{width:0}to{width:100%}}

.anim-in{animation:fadeIn 0.4s ease forwards;}
.anim-slide{animation:slideUp 0.35s ease forwards;}
.delay1{animation-delay:0.3s;opacity:0;}
.delay2{animation-delay:0.6s;opacity:0;}
.delay3{animation-delay:0.9s;opacity:0;}
.delay4{animation-delay:1.2s;opacity:0;}
.delay5{animation-delay:1.5s;opacity:0;}

/* Tag app */
.app-tag{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:0.65rem;font-weight:700;margin-bottom:4px;}
.tag-famille{background:rgba(66,165,245,0.2);color:#90caf9;border:1px solid rgba(66,165,245,0.3);}
.tag-maman{background:rgba(196,120,152,0.2);color:#e0a0bf;border:1px solid rgba(196,120,152,0.3);}
</style>

/* ════════════════════════════
   ENGINE
════════════════════════════ */
let curIdx = 0;
let playing = false;
let timer = null;
let progTimer = null;
let progStart = 0;
const SCENE_DUR = 5000; // ms per scene

function render(){
  const s = SCENES[curIdx];
  document.getElementById('sceneNum').textContent = `Scène ${curIdx+1} / ${SCENES.length}`;
  document.getElementById('sceneTitle').textContent = s.title;
  document.getElementById('sceneDesc').textContent = s.desc;
  document.getElementById('hdrSub').textContent = s.chapter===0 ? '📱 Application des enfants' : '📱 Application de Maman';

  // chapter pills
  document.getElementById('pill0').classList.toggle('on', s.chapter===0);
  document.getElementById('pill1').classList.toggle('on', s.chapter===1);

  // screen
  document.getElementById('phoneScreen').innerHTML = s.screen();

  // dots
  const dc = document.getElementById('dots');
  dc.innerHTML = SCENES.map((_,i)=>`<div class="dot${i===curIdx?' on':''}" onclick="goScene(${i})"></div>`).join('');

  // progress reset
  stopProg();
  if(playing) startProg();
}

function goScene(i){
  curIdx = Math.max(0, Math.min(SCENES.length-1, i));
  render();
}
function goChapter(ch){
  const idx = SCENES.findIndex(s=>s.chapter===ch);
  if(idx>=0) goScene(idx);
}
function next(){
  if(curIdx < SCENES.length-1){ curIdx++; render(); }
  else if(playing){ stopPlay(); }
}
function prev(){
  if(curIdx > 0){ curIdx--; render(); }
}

/* PLAY / PAUSE */
function togglePlay(){
  playing ? stopPlay() : startPlay();
}
function startPlay(){
  playing = true;
  document.getElementById('playBtn').textContent = '⏸';
  startProg();
}
function stopPlay(){
  playing = false;
  document.getElementById('playBtn').textContent = '▶';
  stopProg();
}

/* PROGRESS BAR */
function startProg(){
  stopProg();
  progStart = Date.now();
  function tick(){
    const elapsed = Date.now() - progStart;
    const pct = Math.min(100, (elapsed / SCENE_DUR) * 100);
    document.getElementById('progFill').style.width = pct + '%';
    if(elapsed >= SCENE_DUR){
      if(curIdx < SCENES.length-1){ curIdx++; render(); }
      else { stopPlay(); document.getElementById('progFill').style.width = '100%'; }
    } else {
      progTimer = requestAnimationFrame(tick);
    }
  }
  progTimer = requestAnimationFrame(tick);
}
function stopProg(){
  if(progTimer){ cancelAnimationFrame(progTimer); progTimer=null; }
  document.getElementById('progFill').style.width = '0%';
}

render();
</script>
